[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bara"
version = "1.0.0"
description = "bara (Building AI Readiness Assessment): readiness canon, ceilings, question bank, agent harness and the reproduction of the paper's results"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "bara/brick/LICENSE"]
authors = [{ name = "Wooyoung Jung" }]
requires-python = ">=3.11"
# tested with Python 3.14.4 and exactly these versions
dependencies = ["rdflib==7.6.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
figures = ["matplotlib==3.11.0"]
level3 = ["pandas==3.0.3", "pyarrow==24.0.0", "huggingface_hub==1.19.0"]

[tool.setuptools]
packages = ["bara"]

[tool.setuptools.package-data]
bara = ["brick/Brick.ttl", "brick/LICENSE", "brick/replacements.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
